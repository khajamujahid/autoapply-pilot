# docker compose up            -> ApplyPilot with SQLite in ./data
# docker compose --profile postgres up   -> also starts Postgres (set DATABASE_URL in .env, see README)
services:
  web:
    build: .
    image: applypilot:latest
    env_file: [{path: .env, required: false}]
    environment:
      RUN_WORKER_IN_PROCESS: "false"
    ports: ["${PORT:-8077}:8077"]
    volumes: ["./data:/app/data"]
    restart: unless-stopped
  worker:
    image: applypilot:latest
    depends_on: [web]
    env_file: [{path: .env, required: false}]
    command: ["python", "-m", "app.worker"]
    volumes: ["./data:/app/data"]
    shm_size: "1gb"
    restart: unless-stopped
  postgres:
    profiles: ["postgres"]
    image: postgres:16-alpine
    environment: {POSTGRES_USER: applypilot, POSTGRES_PASSWORD: applypilot, POSTGRES_DB: applypilot}
    volumes: ["./data/postgres:/var/lib/postgresql/data"]
    restart: unless-stopped
